services:
  postgres:
    image: postgres:16-alpine
    container_name: speclens-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: speclens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d speclens"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: speclens-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/scripts/create-bucket.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: speclens-artifacts
    volumes:
      - ./docker/minio/create-bucket.sh:/scripts/create-bucket.sh:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: speclens-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-speclens.json:/opt/keycloak/data/import/realm-speclens.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: node:22-bookworm
    container_name: speclens-api
    working_dir: /workspace
    command: >
      bash -lc "npm install && npm run dev:api"
    environment:
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/speclens
      KEYCLOAK_ISSUER_URL: http://localhost:8081/realms/speclens
      KEYCLOAK_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/speclens
      KEYCLOAK_CLIENT_ID: speclens-web
      KEYCLOAK_CLIENT_SECRET: speclens-web-secret
      OBJECT_STORAGE_PROVIDER: s3-compatible
      OBJECT_STORAGE_BUCKET: speclens-artifacts
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
      AI_PROVIDER_ORDER: openai,openai-codex
      RUNNER_URL: http://runner:4510
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  web:
    image: node:22-bookworm
    container_name: speclens-web
    working_dir: /workspace
    command: >
      bash -lc "npm install && npm run dev:web"
    environment:
      APP_URL: http://localhost:3000
      API_URL: http://api:4000
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      KEYCLOAK_ISSUER_URL: http://localhost:8081/realms/speclens
      KEYCLOAK_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/speclens
      KEYCLOAK_CLIENT_ID: speclens-web
      KEYCLOAK_CLIENT_SECRET: speclens-web-secret
      KEYCLOAK_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - next-cache:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started

  runner:
    image: node:22-bookworm
    container_name: speclens-runner
    working_dir: /workspace
    command: >
      bash -lc "npm install && npm run dev:runner"
    environment:
      RUNNER_POLL_INTERVAL_MS: 5000
      RUNNER_MAX_CONCURRENCY: 2
      RUNNER_HEALTH_PORT: 4510
      SANDBOX_IMAGE: speclens/analysis-runner:local
      API_URL: http://api:4000
    ports:
      - "4510:4510"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  root-node-modules:
  next-cache:
