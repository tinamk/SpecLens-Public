name: Production Browser E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL for the production/public-host suite
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      base_url:
        required: false
        default: ""
        type: string
    secrets:
      E2E_BASE_URL:
        required: false
      E2E_OWNER_USERNAME:
        required: true
      E2E_OWNER_PASSWORD:
        required: true
      E2E_MEMBER_USERNAME:
        required: true
      E2E_MEMBER_PASSWORD:
        required: true
      E2E_OUTSIDER_USERNAME:
        required: true
      E2E_OUTSIDER_PASSWORD:
        required: true
      E2E_ADMIN_USERNAME:
        required: false
      E2E_ADMIN_PASSWORD:
        required: false
      E2E_GITHUB_INSTALLATION_ID:
        required: false
      E2E_GITHUB_PRIVATE_REPO_URL:
        required: false
      E2E_GITHUB_PRIVATE_REPO_FULL_NAME:
        required: false

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    env:
      E2E_OWNER_USERNAME: ${{ secrets.E2E_OWNER_USERNAME }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_MEMBER_USERNAME: ${{ secrets.E2E_MEMBER_USERNAME }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_OUTSIDER_USERNAME: ${{ secrets.E2E_OUTSIDER_USERNAME }}
      E2E_OUTSIDER_PASSWORD: ${{ secrets.E2E_OUTSIDER_PASSWORD }}
      E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_GITHUB_INSTALLATION_ID: ${{ secrets.E2E_GITHUB_INSTALLATION_ID }}
      E2E_GITHUB_PRIVATE_REPO_URL: ${{ secrets.E2E_GITHUB_PRIVATE_REPO_URL }}
      E2E_GITHUB_PRIVATE_REPO_FULL_NAME: ${{ secrets.E2E_GITHUB_PRIVATE_REPO_FULL_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve production base URL
        run: |
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="${{ secrets.E2E_BASE_URL }}"
          fi
          if [ -z "$BASE_URL" ]; then
            echo "Provide inputs.base_url or secrets.E2E_BASE_URL." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Run production browser E2E
        run: npm run e2e:production

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-production
          path: test-results
          if-no-files-found: warn
