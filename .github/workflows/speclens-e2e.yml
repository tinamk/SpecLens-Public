name: SpecLens Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate local baseline
        run: npm run validate:local

      - name: Run label lint
        run: npm run labels:lint

      - name: Run TagTwo analysis
        run: npm run speclens:analyze:tagtwo

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: speclens-reports
          path: reports
          if-no-files-found: warn
