name: SpecLens Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate local baseline
        run: npm run validate:local

      - name: Check workspace outputs
        if: ${{ always() }}
        id: validate_workspace_outputs
        run: |
          if [ -d .speclens-workspace ] && find .speclens-workspace -type f -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workspace outputs
        if: ${{ always() && steps.validate_workspace_outputs.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: speclens-workspace
          path: .speclens-workspace
          include-hidden-files: true
          if-no-files-found: ignore

  hosted-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run hosted browser E2E
        run: npm run e2e:hosted

      - name: Check workspace outputs
        if: ${{ always() }}
        id: hosted_workspace_outputs
        run: |
          if [ -d .speclens-workspace ] && find .speclens-workspace -type f -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture Docker logs
        if: ${{ always() }}
        run: |
          (docker compose version >/dev/null 2>&1 && docker compose logs --no-color > compose.log) || docker-compose logs --no-color > compose.log

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn

      - name: Upload Docker logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: warn

      - name: Upload workspace outputs
        if: ${{ always() && steps.hosted_workspace_outputs.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-speclens-workspace
          path: .speclens-workspace
          include-hidden-files: true
          if-no-files-found: ignore
